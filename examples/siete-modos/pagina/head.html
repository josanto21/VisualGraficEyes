<title>Siete modos VGE</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: panel de instrumentos — cabecera, selector de modos tipo conmutador, un banco de trabajo con cuadrícula por modo. */
:root {
  --paper: #eef2f4;
  --panel: #fbfcfd;
  --stage: #f4f7f9;
  --grid: rgba(35, 70, 100, .07);
  --ink: #142029;
  --ink-2: #4b5a67;
  --ink-3: #6f7e8a;
  --rule: #d3dce2;
  --flow: #2763c9;
  --ctrl: #d4650b;
  --ok: #17824a;
  --cons: #7d3cc4;
  --crit: #d03b3b;
  --flow-soft: rgba(39, 99, 201, .12);
  --ctrl-soft: rgba(212, 101, 11, .12);
  --ok-soft: rgba(23, 130, 74, .12);
  --cons-soft: rgba(125, 60, 196, .11);
  --on-ink: #f5f8fa;
  --f-display: "Big Shoulders Display", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0d1419; --panel: #131c23; --stage: #0f171d; --grid: rgba(150, 190, 220, .06);
    --ink: #e6edf2; --ink-2: #a5b4c0; --ink-3: #8191a0; --rule: #26343e;
    --flow: #6aa0f2; --ctrl: #f0913f; --ok: #44c27f; --cons: #b48af2; --crit: #e25656;
    --flow-soft: rgba(106, 160, 242, .16); --ctrl-soft: rgba(240, 145, 63, .15); --ok-soft: rgba(68, 194, 127, .15); --cons-soft: rgba(180, 138, 242, .15);
    --on-ink: #0d1419; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0d1419; --panel: #131c23; --stage: #0f171d; --grid: rgba(150, 190, 220, .06);
  --ink: #e6edf2; --ink-2: #a5b4c0; --ink-3: #8191a0; --rule: #26343e;
  --flow: #6aa0f2; --ctrl: #f0913f; --ok: #44c27f; --cons: #b48af2; --crit: #e25656;
  --flow-soft: rgba(106, 160, 242, .16); --ctrl-soft: rgba(240, 145, 63, .15); --ok-soft: rgba(68, 194, 127, .15); --cons-soft: rgba(180, 138, 242, .15);
  --on-ink: #0d1419; color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font: 15px/1.55 var(--f-sans); }
.wrap { max-width: 940px; margin: 0 auto; padding-block: 20px 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 16px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--flow); outline-offset: 2px; border-radius: 6px; }

/* Cabecera */
.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px; }
.top .eyebrow { font: 500 11.5px/1 var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); }
.top h1 { font: 800 clamp(40px, 9vw, 64px)/.92 var(--f-display); text-transform: uppercase; letter-spacing: .01em; margin-top: 6px; }
.top .lede { color: var(--ink-2); max-width: 46ch; margin-top: 8px; }
.level { display: grid; gap: 6px; }
.level legend, .lbl { font: 500 11px/1 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 9px; background: var(--panel); padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg label { position: relative; }
.seg input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.seg span { display: block; padding: 7px 12px; border-radius: 6px; font-size: 13.5px; font-weight: 500; color: var(--ink-2); min-height: 44px; display: flex; align-items: center; }
.seg input:checked + span { background: var(--ink); color: var(--on-ink); }
.seg input:focus-visible + span { outline: 3px solid var(--flow); outline-offset: 1px; }
fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }

/* Selector de modos */
.tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: thin; padding-bottom: 4px; scroll-snap-type: x proximity; }
.tab { flex: 0 0 auto; scroll-snap-align: start; display: grid; gap: 2px; text-align: left; border: 1px solid var(--rule); background: var(--panel); border-radius: 9px; padding: 8px 12px 9px; cursor: pointer; min-height: 52px; }
.tab b { font: 700 17px/1 var(--f-display); letter-spacing: .04em; text-transform: uppercase; }
.tab small { font-size: 12px; color: var(--ink-3); }
.tab[aria-selected="true"] { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
.tab[aria-selected="true"] small { color: inherit; opacity: .78; }

/* Panel de cada modo */
.panel { background: var(--panel); border: 1px solid var(--rule); border-radius: 14px; padding: 18px; display: grid; gap: 14px; min-width: 0; }
.phead { display: grid; gap: 6px; }
.phead h2 { font: 600 clamp(19px, 3.4vw, 23px)/1.25 var(--f-sans); }
.why { color: var(--ink-2); font-size: 14px; max-width: 70ch; }
.why b { font: 500 11.5px/1 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink); margin-right: 4px; }
.prov { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 500 11px/1.2 var(--f-mono); letter-spacing: .04em; border: 1px solid var(--rule); border-radius: 5px; padding: 4px 7px; color: var(--ink-2); }
.chip code { font: inherit; color: inherit; }
.chip.kind { color: var(--ink); border-color: var(--ink-3); font-weight: 500; letter-spacing: .1em; }
.chip.warn { border-style: dashed; }

.stage { position: relative; background-color: var(--stage); background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 22px 22px; border: 1px solid var(--rule); border-radius: var(--r); overflow: hidden; min-width: 0; }
.stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.stage.three { height: clamp(360px, 62vw, 480px); }
.stage-cap { position: absolute; left: 10px; top: 10px; right: 10px; pointer-events: none; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.stage-cap .step { font: 500 11px/1 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; background: var(--ink); color: var(--on-ink); padding: 5px 7px; border-radius: 4px; }
.stage-cap .say { font-size: 14px; font-weight: 500; background: color-mix(in srgb, var(--panel) 86%, transparent); padding: 3px 8px; border-radius: 5px; max-width: 46ch; }
.fallback { padding: 24px; color: var(--ink-2); }

.callout { position: absolute; max-width: min(240px, 62%); background: var(--panel); border: 1px solid var(--ink-3); border-radius: 8px; padding: 8px 10px; font-size: 13px; line-height: 1.4; box-shadow: 0 6px 20px rgba(0,0,0,.12); pointer-events: none; }
.callout b { display: block; font-size: 14px; }
.callout .tec { color: var(--ink-2); margin-top: 4px; font-size: 12.5px; }
.leader { position: absolute; inset: 0; pointer-events: none; overflow: visible; }

.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { border: 1px solid var(--rule); background: var(--panel); border-radius: 8px; min-height: 44px; padding: 8px 13px; cursor: pointer; font-size: 14px; font-weight: 500; }
.btn:hover { border-color: var(--ink-3); }
.btn[aria-pressed="true"], .btn.on { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
.btn.sm { min-height: 44px; padding: 5px 11px; font-size: 13px; }
.steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 6px; }
.steps .btn { text-align: left; display: flex; gap: 8px; align-items: center; }
.steps .btn i { font: 500 11px/1 var(--f-mono); font-style: normal; opacity: .7; }
.ctl { display: grid; gap: 4px; min-width: 0; }
.ctl label { display: flex; justify-content: space-between; gap: 8px; font-size: 13.5px; }
.ctl output, .num { font: 500 13.5px/1.2 var(--f-mono); font-variant-numeric: tabular-nums; }
input[type="range"] { width: 100%; accent-color: var(--ink); min-height: 44px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px 18px; }

.readout { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.readout div { border: 1px solid var(--rule); border-radius: 8px; padding: 8px 10px; display: grid; gap: 2px; min-width: 0; }
.readout span { font: 500 10.5px/1.2 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.readout b { font: 500 17px/1.25 var(--f-mono); font-variant-numeric: tabular-nums; }

.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--ink-2); }
.legend i { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

.layer { border-left: 3px solid var(--rule); padding: 2px 0 2px 12px; display: grid; gap: 6px; color: var(--ink-2); font-size: 14px; }
.layer .lbl { color: var(--ink-3); }
.layer code, .mono { font: 13px/1.5 var(--f-mono); color: var(--ink); }
main[data-level="1"] .lv2, main[data-level="1"] .lv3, main[data-level="2"] .lv3 { display: none !important; }

.take { display: grid; gap: 4px; border-top: 1px solid var(--rule); padding-top: 12px; }
.take .lbl { color: var(--ink); }
.take p { font-weight: 500; max-width: 70ch; }

.parts { display: flex; flex-wrap: wrap; gap: 6px; }
details.more { border: 1px solid var(--rule); border-radius: 8px; padding: 0 12px; }
details.more summary { cursor: pointer; min-height: 44px; display: flex; align-items: center; font-weight: 500; font-size: 14px; }
details.more[open] { padding-bottom: 12px; }
pre.code { margin: 0; overflow-x: auto; background: var(--stage); border: 1px solid var(--rule); border-radius: 8px; padding: 10px 12px; font: 12.5px/1.6 var(--f-mono); }

/* Laboratorio */
.svgbox { overflow-x: auto; }
svg text { font-family: var(--f-sans); }
svg .mono { font-family: var(--f-mono); }

/* Pasos */
.sortbox { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 12px; }
@media (max-width: 640px) { .sortbox { grid-template-columns: 1fr; } }
.bars { position: relative; height: 200px; margin: 14px 12px 6px; }
.bar { position: absolute; bottom: 22px; width: 0; transition: transform .45s cubic-bezier(.3,.7,.2,1), background-color .2s; border-radius: 6px 6px 0 0; display: flex; align-items: flex-start; justify-content: center; }
.bar span { font: 600 15px/1 var(--f-mono); padding-top: 6px; color: var(--on-ink); }
.bar.idle { background: var(--ink-3); }
.bar.cmp { background: var(--flow); }
.bar.swap { background: var(--ctrl); }
.bar.done { background: var(--ok); }
.slotlbl { position: absolute; bottom: 0; font: 11px/1 var(--f-mono); color: var(--ink-3); text-align: center; }
.code-lines { margin: 0; padding: 8px 0; background: var(--stage); border: 1px solid var(--rule); border-radius: 8px; font: 13px/1.75 var(--f-mono); list-style: none; counter-reset: ln; overflow-x: auto; }
.code-lines li { padding: 0 12px 0 0; white-space: pre; counter-increment: ln; border-left: 3px solid transparent; }
.code-lines li::before { content: counter(ln); display: inline-block; width: 28px; text-align: right; margin-right: 10px; color: var(--ink-3); }
.code-lines li.hl { background: var(--ctrl-soft); border-left-color: var(--ctrl); }
.status { min-height: 46px; font-weight: 500; }

/* Video */
.vid { width: 100%; max-width: 540px; aspect-ratio: 1; display: block; margin: 0 auto; background: #0f161c; border-radius: 10px; max-height: 70vh; }
.timeline { display: grid; grid-template-columns: 5fr 10fr 5fr; gap: 4px; max-width: 540px; margin: 0 auto; width: 100%; }
.timeline .btn { text-align: left; display: grid; gap: 2px; font-size: 13px; padding: 7px 9px; }
.timeline .btn small { font: 11px/1 var(--f-mono); opacity: .75; }

/* Mapa */
.map svg { width: 100%; max-width: 560px; display: block; margin: 0 auto; height: auto; }
.node rect { stroke-width: 1.5; }
.node text { font-size: 12.5px; fill: var(--ink); }
.node .t { font-weight: 600; font-size: 13.5px; }
.node .s { fill: var(--ink-2); }
.node .f { font-family: var(--f-mono); font-size: 10.5px; fill: var(--ink-2); }
.edge { fill: none; stroke-width: 2; transition: opacity .3s; }
.cut { stroke-dasharray: 5 5; opacity: .45; }
.faded { opacity: .3; transition: opacity .3s; }
.toggles .btn { display: inline-flex; align-items: center; gap: 6px; }
.toggles .btn::before { content: ""; width: 12px; height: 12px; border-radius: 3px; border: 1.5px solid currentColor; }
.toggles .btn[aria-pressed="true"]::before { background: currentColor; box-shadow: inset 0 0 0 2px var(--ink); }

/* Datos */
.chart svg { width: 100%; max-width: 640px; height: auto; display: block; margin: 0 auto; }
.chart .ax { stroke: var(--rule); }
.chart .tick text, .chart .axt { fill: var(--ink-3); font-size: 11px; }
.chart .lim { stroke: var(--crit); stroke-dasharray: 5 4; stroke-width: 1.5; }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--on-ink); font: 12px/1.35 var(--f-mono); padding: 6px 8px; border-radius: 6px; white-space: nowrap; transform: translate(-50%, calc(-100% - 8px)); }
.ledbox { display: flex; align-items: center; gap: 14px; }
.led { width: 46px; height: 46px; border-radius: 50%; flex: 0 0 auto; border: 2px solid var(--rule); }
.warn-t { color: var(--crit); font-weight: 600; }
table.data { border-collapse: collapse; width: 100%; font-size: 13px; }
table.data th, table.data td { padding: 6px 8px; border-bottom: 1px solid var(--rule); text-align: right; font-variant-numeric: tabular-nums; }
table.data th:first-child, table.data td:first-child { text-align: left; }

.foot { display: flex; flex-wrap: wrap; gap: 4px 12px; justify-content: space-between; color: var(--ink-3); font-size: 13px; border-top: 1px solid var(--rule); padding-top: 12px; }
.foot a { color: var(--ink-2); display: inline-flex; align-items: center; min-height: 44px; }
@media (max-width: 520px) {
  .panel { padding: 14px; }
  .stage-cap .say { font-size: 13px; }
}
@media (prefers-reduced-motion: reduce) {
  .bar, .edge, .faded { transition: none; }
}
</style>
