   <section class="layer-panel layer-two" hidden><h2>Lo mismo, con sus nombres</h2><p class="technical-text"></p><p class="scene-error" hidden></p><div class="signal-card" hidden><h3>El turno de A y el turno de B</h3><p>B llega antes al mismo punto de su curva; A llega después. La línea blanca marca ahora en ambas.</p><div class="wave-labels"><span class="ink-a">Bobina A (principal)</span><span class="ink-b">Bobina B (auxiliar)</span></div><svg class="waves" viewBox="0 0 360 152" role="img" aria-label="Dos ondas de electricidad: B se adelanta a A; la línea blanca marca el mismo instante que el brillo de los rollos"></svg><div class="wave-directions"><span>Arriba: un sentido</span><span>Abajo: sentido contrario</span></div><label for="vge-cursor">Mueve la línea blanca para elegir el instante</label><input type="range" id="vge-cursor" min="0" max="999" step="1" value="0" aria-valuetext="Inicio del ciclo"><p>Más lejos del centro de la gráfica = más brillo en ese rollo.</p><p class="signal-values"></p><p class="unit-note">Escala de ejemplo: 1 es el máximo elegido para A; 0 es el cambio de sentido. No son amperios medidos.</p></div></section>
   <section class="layer-panel layer-three" hidden><h2>Cómo se construye esta explicación</h2><p class="advanced-text"></p><div class="math-block"><p>El reloj común avanza θ; δ > 0 es el adelanto de B:</p><pre>i_A = sin(θ)
i_B = a · sin(θ + δ)
B* = (0, i_A, −i_B)</pre><p>i_A e i_B son señales de ejemplo; a es la amplitud relativa de B. B* es el vector de campo ilustrativo con ganancias iguales, sin unidades físicas.</p><p>La cajita (capacitor) adelanta la corriente de B respecto de A. Elegimos el eje positivo de B en −Z: con estas referencias la flecha y la pieza que gira avanzan hacia +X. El capacitor no es un temporizador; no deducimos δ de la capacidad de la cajita (capacitancia).</p><p class="parameter-values"></p></div><p>Las luces, el cursor y la flecha leen el mismo reloj. El brillo usa el valor absoluto de la señal, no luz ni calor reales.</p><p class="material-note">El gris distingue piezas neutras: algunas son de metal y otras, como la cajita, de plástico. La flecha verde es una ayuda para imaginar el campo. No se calculan fuerza, velocidad real, oposición al paso de la electricidad (impedancia), calentamiento ni cantidad de aire.</p><button type="button" class="open-json">Abrir otro modelo (archivo JSON)</button></section>

:{samples:28,arc:.85,opacity:.8}}};var x_={title:"¿Cómo hace girar un motor eléctrico las aspas?",scope:"Dibujo para entender la idea; no mide fuerza ni velocidad real",story:[{title:"Dos personas, una rueda",text:"Las bobinas son rollos de alambre: imagina dos personas que empujan una rueda, una después de la otra. En este relevo B empuja primero y A después.",focus:"b",next:"Ver el relevo",technical:"Los rollos de alambre son Bobina A (devanado principal) y Bobina B (devanado auxiliar). No son dos impulsos separados: sus acciones se superponen.",advanced:"La analogía de las personas explica la cooperación; las bobinas no empujan con manos ni se encienden por turnos exclusivos. Su acción magnética varía continuamente y puede coincidir."},{title:"La cajita adelanta a B",text:"La cajita de arranque es la que adelanta a B, como quien avisa a una persona para que empuje primero. A empuja después y la cajita sigue ayudando mientras el motor gira.",focus:"capacitor",next:"Ver qué crean juntas",technical:"La cajita de arranque es el arranque eléctrico (capacitor permanente). Adelanta la electricidad que circula por B (corriente auxiliar) respecto de A (corriente principal); sigue conectada durante la marcha en este motor PSC.",advanced:"La corriente de la rama auxiliar B adelanta a la de la principal A: i_B = a·sin(θ + δ) frente a i_A = sin(θ), con δ > 0. Elegimos el eje positivo de B en −Z, de modo que B* = (0, i_A, −i_B) gira hacia +X como la pieza central. El capacitor no es un temporizador: no se calcula δ a partir de la capacitancia ni se resuelve la impedancia de la rama."},{title:"Un imán invisible que gira",text:"Ese relevo crea un imán invisible que da vueltas. Es una forma de imaginar un empuje sin tocar: no hay un imán sólido girando dentro.",focus:"field",next:"Verlo dentro del motor",technical:"El imán invisible es el campo magnético giratorio. Se forma al combinar dos acciones en direcciones distintas y en momentos distintos.",advanced:"El imán invisible (campo magnético) se aproxima con dos acciones en direcciones perpendiculares, con la misma conversión de electricidad a campo (ganancia). Con amplitudes iguales y separación de 90°, la flecha mantiene su longitud; fuera de ese caso suele dibujar una elipse. No se calculan la intensidad en teslas ni el campo en cada lugar del interior."},{title:"Ahora míralo dentro",text:"Como dos personas empujando una rueda, B empuja primero y A después gracias a la cajita que adelanta a B. Juntas crean un imán invisible que gira, arrastra la pieza central y mueve las aspas por la barra.",focus:"rotor_core",next:"Explorar las piezas",technical:"La parte fija con bobinas (estator) rodea la pieza que gira (rotor). La barra central (eje) lleva su giro a las aspas.",advanced:"El campo variable crea electricidad dentro de la pieza de metal que gira (corrientes inducidas en el rotor); al interactuar con el campo produce el efecto de giro (par). Esta ilustración no resuelve esas corrientes, la aceleración ni la diferencia de velocidad entre el campo y la pieza (deslizamiento). El giro se dibuja en el mismo sentido y más lento que la flecha, sin calcular una velocidad física."}],parts:[{id:"main_winding",name:"Bobina A",function:"Empuja después de B.",term:"bobina",anchor:[0,.61,0],technical:"Bobina A (principal)"},{id:"aux_winding",name:"Bobina B",function:"Empuja primero.",term:"bobina",anchor:[0,.61,0],technical:"Bobina B (auxiliar)"},{id:"capacitor",name:"Arranque eléctrico",function:"La que adelanta a B.",term:"capacitor",anchor:[0,.1,0],technical:"Arranque eléctrico (capacitor)"},{id:"rotor_core",name:"Pieza que gira",function:"Sigue al imán invisible.",term:"giro",anchor:[.25,0,0],technical:"Pieza que gira (rotor)"},{id:"blades",name:"Aspas",function:"Empujan el aire.",term:"aspas",anchor:[0,.7,0],technical:"Aspas (hélice)"},{id:"stator",name:"Parte fija con bobinas",function:"Sostiene los rollos de alambre.",term:"bobina",anchor:[0,0,-.7],technical:"Parte fija con bobinas (estator)"}
